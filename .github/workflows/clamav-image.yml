name: Build & push ClamAV image

on:
  push:
    branches: [main]
    paths: ['clamav/Dockerfile']
  schedule:
    # Rebuild daily so the baked-in virus definitions don't go stale
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.ACR_REGISTRY_ADDRESS }}/clamav

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to registry
        uses: docker/login-action@v4.5.0
        with:
          registry: ${{ secrets.ACR_REGISTRY_ADDRESS }}
          username: ${{ secrets.ACR_REGISTRY_USERNAME }}
          password: ${{ secrets.ACR_REGISTRY_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: clamav
          push: true
          # No layer cache: freshclam must fetch the current database on every build
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.run_id }}
